<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#40916c"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
    <linearGradient id="gemGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Pixel Border -->
  <path d="M12 8 h40 v24 c0 16 -20 26 -20 26 s-20 -10 -20 -26 v-24 z" fill="#0d2818" />
  
  <!-- Main Shield Body -->
  <path d="M16 12 h32 v20 c0 13 -16 21 -16 21 s-16 -8 -16 -21 v-20 z" fill="url(#shieldGrad)" />
  
  <!-- Shield Inset Highlight -->
  <path d="M20 16 h24 v16 c0 9 -12 15 -12 15 s-12 -6 -12 -15 v-16 z" fill="#2d6a4f" />

  <!-- Center Adventurer Compass / 4-Point Star Gem -->
  <g filter="url(#glow)">
    <polygon points="32,20 35,28 43,31 35,34 32,42 29,34 21,31 29,28" fill="url(#gemGrad)" />
    <!-- Center Sparkle Core -->
    <circle cx="32" cy="31" r="2.5" fill="#ffffff" />
  </g>
</svg>
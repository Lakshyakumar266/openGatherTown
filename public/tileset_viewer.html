<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>RPGpack Sheet Viewer</title>
<style>
  body { background: #1e293b; color: #fff; font-family: monospace; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(20, 68px); gap: 4px; }
  .tile { width: 64px; height: 64px; border: 1px solid #475569; position: relative; background: #0f172a; overflow: hidden; }
  .tile img { position: absolute; }
  .label { position: absolute; bottom: 0; right: 0; background: rgba(0,0,0,0.8); font-size: 9px; padding: 1px 2px; }
</style>
</head>
<body>
<h2>Kenney RPGpack Sheet 2X (20 cols x 13 rows, 128x128 tiles)</h2>
<div class="grid" id="grid"></div>
<script>
  const grid = document.getElementById('grid');
  for (let r = 0; r < 13; r++) {
    for (let c = 0; c < 20; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      const img = document.createElement('img');
      img.src = '/tiles/RPGpack_sheet_2X.png';
      img.style.left = `-${c * 64}px`;
      img.style.top = `-${r * 64}px`;
      img.style.width = `${20 * 64}px`;
      img.style.height = `${13 * 64}px`;
      tile.appendChild(img);
      const lbl = document.createElement('div');
      lbl.className = 'label';
      lbl.innerText = `${c},${r}`;
      tile.appendChild(lbl);
      grid.appendChild(tile);
    }
  }
</script>
</body>
</html>
